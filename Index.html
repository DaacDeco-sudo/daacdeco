<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaacDeco - Herrería a Medida</title>
    <style>
        :root {
            --primary: #ff9800;
            --dark: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #25d366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--surface);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        nav {
            background-color: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
        }

        nav a:hover {
            color: var(--primary);
        }

        section {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        h2 {
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            margin-bottom: 20px;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .catalog-item {
            background-color: var(--surface);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .catalog-item:hover {
            transform: translateY(-5px);
        }

        .catalog-item img {
            max-width: 100%;
            border-radius: 4px;
            margin-bottom: 10px;
            height: 150px;
            object-fit: cover;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background-color: var(--primary);
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #e68900;
        }

        #resultado {
            margin-top: 30px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        #whatsappBtn {
            background-color: var(--accent);
            color: #fff;
            display: none;
        }

        #whatsappBtn:hover {
            background-color: #128c7e;
        }

        .referral-section {
            background-color: #1a3322;
            border: 1px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
            text-align: center;
        }

        #refLink {
            background: #112217;
            padding: 10px;
            border: 1px dashed var(--accent);
            display: block;
            margin: 15px 0;
            word-break: break-all;
            color: var(--accent);
            font-family: monospace;
        }
    </style>
</head>
<body>

<header>
    <h1>DaacDeco</h1>
</header>

<!-- Video de fondo con reproducción automática en bucle, silenciado -->
<video class="hero-video" autoplay loop muted playsinline>
    <source src="https://www.w3schools.com/howto/rain.mp4" type="video/mp4">
    Tu navegador no soporta videos.
</video>

<nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#cotizador">Cotizador</a>
    <a href="#afiliados">Compartir y Ganar</a>
</nav>

<section id="catalogo">
    <h2>Nuestros Trabajos</h2>
    <div class="catalog-grid">
        <div class="catalog-item">
            <img src="https://via.placeholder.com/200x150" alt="Puertas Pantográficas">
            <h3>Puertas Pantográficas</h3>
        </div>
        <div class="catalog-item">
            <img src="https://via.placeholder.com/200x150" alt="Muebles">
            <h3>Muebles</h3>
        </div>
        <div class="catalog-item">
            <img src="https://via.placeholder.com/200x150" alt="Frentes de Parrilla">
            <h3>Frentes de Parrilla</h3>
        </div>
    </div>
</section>

<section id="cotizador">
    <h2>Calculador de Presupuestos</h2>
    
    <div class="form-group">
        <label for="alto">Alto (metros):</label>
        <input type="number" id="alto" step="0.01" placeholder="Ej: 2.00" required>
    </div>

    <div class="form-group">
        <label for="ancho">Ancho (metros):</label>
        <input type="number" id="ancho" step="0.01" placeholder="Ej: 1.50" required>
    </div>

    <div class="form-group">
        <label for="color">Color:</label>
        <select id="color">
            <option value="Negro Brillante">Negro Brillante</option>
            <option value="Negro Mate">Negro Mate</option>
            <option value="Negro Satinado">Negro Satinado</option>
            <option value="Gris">Gris</option>
        </select>
    </div>

    <div class="form-group">
        <label for="manijon">Manijón:</label>
        <select id="manijon">
            <option value="Tubo Estructural 20/20">Tubo Estructural 20/20</option>
            <option value="Tubo Ovalado 30/10">Tubo Ovalado 30/10</option>
            <option value="Acero Inoxidable (+ $90.000)">Acero Inoxidable (+ $90.000)</option>
        </select>
    </div>

    <button onclick="cotizar()">Calcular Presupuesto</button>

    <div id="resultado"></div>
    <button id="whatsappBtn" onclick="enviarWhatsApp()">Confirmar pedido por WhatsApp</button>
</section>

<section id="afiliados" class="referral-section">
    <h2>¡Compartí y Ganá!</h2>
    <p>Recomendá DaacDeco. Si tus conocidos compran, te llevás una comisión del 5%.</p>
    <span id="refLink">daacdeco.com/?ref=usuario123</span>
    <button onclick="copiarLink()" style="background-color: var(--accent); color: #fff;">Copiar enlace</button>
</section>

<script>
    function cotizar() {
        const alto = parseFloat(document.getElementById('alto').value);
        const ancho = parseFloat(document.getElementById('ancho').value);
        const color = document.getElementById('color').value;
        const manijon = document.getElementById('manijon').value;

        if (isNaN(alto) || isNaN(ancho) || alto <= 0 || ancho <= 0) {
            alert('Por favor, ingresa medidas válidas.');
            return;
        }

        const metrosCuadrados = alto * ancho;
        const precioMetro = 450000;
        let total = metrosCuadrados * precioMetro;

        if (manijon.includes('Acero Inoxidable')) {
            total += 90000;
        }

        document.getElementById('resultado').innerText = `Presupuesto Estimado: $${total.toLocaleString('es-AR')}`;
        document.getElementById('whatsappBtn').style.display = 'block';

        // Guardar datos temporalmente
        window.datosCotizacion = { alto, ancho, color, manijon, total };
    }

    function enviarWhatsApp() {
        const datos = window.datosCotizacion;
        const mensaje = `Hola, quiero solicitar un presupuesto para una estructura de herrería con las siguientes características:%0A%0A- Medidas: ${datos.alto}m x ${datos.ancho}m%0A- Color: ${datos.color}%0A- Manijón: ${datos.manijon}%0A- Presupuesto estimado: $${datos.total.toLocaleString('es-AR')}%0A%0A¿Cómo podemos avanzar?`;
        
        // Reemplazar con tu número de WhatsApp
        window.location.href = `https://wa.me/543854000000?text=${mensaje}`;
    }

    function copiarLink() {
        const link = document.getElementById('refLink').innerText;
        navigator.clipboard.writeText(link).then(() => {
            alert('¡Enlace copiado al portapapeles!');
        });
    }
</script>

</body>
</html>
